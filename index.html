<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matheus Santana</title>
  <style>
  :root {
    --outer-bg: hsl(45 13% 8%);
    --page-bg:  hsl(40 12% 5%);
    --text:     hsl(40 45% 84%); 
  }
html {
  background: var(--outer-bg);
}
body {
  margin: 0 auto;
  max-width: 1200px;
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
  font-family: system-ui;
  background: var(--page-bg);
  color: var(--text);
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-flow: dense;
  gap: 12px;
}
.gallery img {
  width: 100%;
  height: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  display: block;
}
.gallery img.tall {
  grid-row: span 2;
  aspect-ratio: auto;
  height: 100%;
  contain: size;
}
.fill {
  position: relative;
  overflow: hidden;
}
.fill::before {
  content: "";
  position: absolute;
  inset: -20px;
  background: var(--img) center / cover;
  filter: blur(16px) brightness(0.6);
}
.fill img {
  position: relative;
  object-fit: contain;
}
.intro {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}
.intro > div,
.me {
  position: relative;
  z-index: 1;
}
.intro h1 {
  margin: 0 0 8px;
}
.intro p {
  margin: 0;
}
.wander {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}
.turtle {
  position: absolute;
  left: -10px;
  top: -17px;
  width: 20px;
  height: 34px;
  transform-origin: 10px 17px;
  z-index: 2;
  pointer-events: none;
}
.turtle polygon {
  fill: hsl(95 35% 55%);
}
.me {
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-end;
  gap: 16px;
  margin: 0;
}
.me img {
  height: 170px;
  width: auto;
  display: block;
  flex-shrink: 0;
}
.me figcaption {
  margin: 0;
  max-width: 230px;
  text-align: right;
  text-wrap: balance;
}
@media (max-width: 600px) {
  .intro { flex-direction: column; }
  .wander, .turtle { display: none; }
}
</style>
</head>
<body>
<header class="intro">
  <canvas class="wander" aria-hidden="true"></canvas>
  <svg class="turtle" viewBox="-10 -17 20 34" aria-hidden="true"><polygon points="0,-16 -2,-14 -1,-10 -4,-7 -7,-9 -9,-8 -6,-5 -7,-1 -5,3 -8,6 -6,8 -4,5 0,7 4,5 6,8 8,6 5,3 7,-1 6,-5 9,-8 7,-9 4,-7 1,-10 2,-14"/></svg>
  <div>
    <h1>Matheus Martinelli Santana</h1>
    <p>Some of my favorite photographs I've taken</p>
  </div>
  <figure class="me">
    <img src="images/me_with_cat.jpg" alt="Cat on lap from far away">
    <figcaption>(My sister took this one. It's the cat from the photo at the bottom on my lap)</figcaption>
  </figure>
</header>
  <div class="gallery">
    <img src="images/donkeys.jpg" alt="Donkeys">
    <img src="images/golden_pheasant.jpg" alt="Golden pheasant">
    <img src="images/agapanthus.jpg" alt="Agapanthus">
    <img src="images/bracket_fungus.jpg" alt="Bracket fungus">
    <img src="images/snowy_owl.jpg" alt="Snowy owl">
    <img src="images/house_sparrow.jpg" alt="House sparrow">
    <img src="images/queen_annes_lace.jpg" alt="Queen Anne's lace">
    <img src="images/background.JPG" alt="Truck">
    <img src="images/cat_tabby.jpg" alt="Domestic cat (tabby)">
    <img src="images/white_cat.JPG" alt="Domestic cat">
    <img src="images/muscovy_ducks.jpg" alt="Muscovy ducks">
    <img src="images/mallard.jpg" alt="Mallard">
    <img src="images/geraniums.JPG" alt="Geraniums">
    <img class="tall" src="images/peacock_pheasant.jpg" alt="Peacock pheasant" style="object-position: right center;">
    <img class="tall" src="images/common_kestrel.jpg" alt="Common kestrel">
    <img src="images/southern_ground_hornbill.jpg" alt="Southern ground hornbill">
    <img src="images/monk_parakeets.jpg" alt="Monk parakeets">
    <img src="images/marabou_stork.jpg" alt="Marabou stork">
    <img src="images/saddle_billed_stork.jpg" alt="Saddle-billed stork" style="aspect-ratio: 4 / 3;">
    <img src="images/cat_tuxedo_grass.jpg" alt="Domestic cat (black and white)">
    <img src="images/peacock.jpeg" alt="Indian peafowl">
    <img src="images/dog.jpeg" alt="Domestic dog (orange)">
  </div>
<script>
(() => {
  const intro = document.querySelector('.intro');
  const canvas = intro.querySelector('.wander');
  const turtle = intro.querySelector('.turtle');
  const title = intro.querySelector('div');
  const photo = intro.querySelector('.me img');
  const caption = intro.querySelector('.me figcaption');
  const ctx = canvas.getContext('2d');
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const FRACTALS = [
    { axiom: 'F--F--F', rules: { F: 'F+F--F+F' }, angle: 60, depth: 3, draw: 'F', heading: 0 },
    { axiom: 'FX', rules: { X: 'X+YF+', Y: '-FX-Y' }, angle: 90, depth: 10, draw: 'F', heading: 0 },
    { axiom: 'A', rules: { A: '+BF-AFA-FB+', B: '-AF+BFB+FA-' }, angle: 90, depth: 4, draw: 'F', heading: 0 },
    { axiom: 'A', rules: { A: 'B-A-B', B: 'A+B+A' }, angle: 60, depth: 6, draw: 'AB', heading: 0 },
    { axiom: 'X', rules: { X: 'F+[[X]-X]-F[X]-X', F: 'FF' }, angle: 25, depth: 4, draw: 'F', heading: -80 },
    { axiom: 'F', rules: { F: '+F--F+' }, angle: 45, depth: 10, draw: 'F', heading: 0 },
    { axiom: 'A', rules: { A: 'A-B--B+A++AA+B-', B: '+A-AA--B-A+B' }, angle: 60, depth: 3, draw: 'AB', heading: 0 }
  ];

  function trace(f) {
    let s = f.axiom;
    for (let i = 0; i < f.depth; i++) s = [...s].map(c => f.rules[c] ?? c).join('');
    const turn = f.angle * Math.PI / 180;
    let x = 0, y = 0, a = f.heading * Math.PI / 180;
    const stack = [], pts = [{ x, y, pen: false }];
    for (const c of s) {
      if (f.draw.includes(c)) { x += Math.cos(a); y += Math.sin(a); pts.push({ x, y, pen: true }); }
      else if (c === '+') a += turn;
      else if (c === '-') a -= turn;
      else if (c === '[') stack.push([x, y, a]);
      else if (c === ']') { [x, y, a] = stack.pop(); pts.push({ x, y, pen: false }); }
    }
    return pts;
  }

  let W = 0, H = 0, areas = [], order = [];
  let pts = [], i = 0, frac = 0, tx = 0, ty = 0, heading = -Math.PI / 2;
  let speed = 1, phase = 'walk', timer = 0, target = null, first = true;
  let aboveCaption = null, firstDone = false;

  function box(el, r, pad) {
    const b = el.getBoundingClientRect();
    return { l: b.left - r.left - pad, t: b.top - r.top - pad, r: b.right - r.left + pad, b: b.bottom - r.top + pad };
  }

  function layout() {
    const r = intro.getBoundingClientRect();
    W = Math.max(0, photo.getBoundingClientRect().left - r.left - 12);
    H = r.height;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.globalAlpha = 0.6;
    const T = box(title, r, 14), C = box(caption, r, 14);
    areas = [
      { x: T.r, y: 0, w: W - T.r, h: C.t },
      { x: T.r, y: 0, w: C.l - T.r, h: H },
      { x: 0, y: T.b, w: C.l, h: H - T.b }
    ].filter(a => a.w >= 60 && a.h >= 60);
    aboveCaption = { x: C.l, y: 0, w: W - C.l, h: C.t };
    start();
  }

  function start() {
    ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H); ctx.restore();
    if (!areas.length) { turtle.style.display = 'none'; return; }
    turtle.style.display = '';
    if (!order.length) order = FRACTALS.map((_, k) => k).sort(() => Math.random() - 0.5);
    const f = FRACTALS[order.pop()];
    const raw = trace(f);
    const xs = raw.map(p => p.x), ys = raw.map(p => p.y);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    const bw = Math.max(...xs) - minX || 1, bh = Math.max(...ys) - minY || 1;
    const weights = areas.map(a => Math.min(a.w, a.h) ** 2);
    let pick = Math.random() * weights.reduce((s, v) => s + v, 0), area = areas[0];
    for (let k = 0; k < areas.length; k++) { pick -= weights[k]; if (pick <= 0) { area = areas[k]; break; } }
    if (!firstDone && aboveCaption.w >= 60 && aboveCaption.h >= 60) area = aboveCaption;
    const pad = 8, s = Math.min((area.w - 2 * pad) / bw, (area.h - 2 * pad) / bh);
    const ox = area.x + pad + Math.random() * (area.w - 2 * pad - bw * s) - minX * s;
    const oy = area.y + pad + (area.h - 2 * pad - bh * s) / 2 - minY * s;
    pts = raw.map(p => ({ x: ox + p.x * s, y: oy + p.y * s, pen: p.pen }));
    let length = 0;
    for (let k = 1; k < pts.length; k++) if (pts[k].pen) length += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
    speed = Math.max(0.5, length / (60 * 8));
    i = 1; frac = 0;
    target = pts[0];
    if (first) { tx = target.x; ty = target.y; first = false; }
    phase = 'walk';
    if (still) { tx = target.x; ty = target.y; while (i < pts.length) advance(1e9); phase = 'done'; }
  }

  function advance(budget) {
    while (budget > 0 && i < pts.length) {
      const p = pts[i - 1], q = pts[i];
      if (!q.pen) { tx = q.x; ty = q.y; i++; frac = 0; continue; }
      const len = Math.hypot(q.x - p.x, q.y - p.y) || 1e-6;
      heading = Math.atan2(q.y - p.y, q.x - p.x);
      const left = len * (1 - frac), go = Math.min(budget, left);
      frac += go / len;
      const nx = p.x + (q.x - p.x) * frac, ny = p.y + (q.y - p.y) * frac;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(nx, ny); ctx.stroke();
      tx = nx; ty = ny; budget -= go;
      if (frac >= 1 - 1e-9) { i++; frac = 0; }
    }
  }

  function placeTurtle() {
    turtle.style.transform = `translate(${tx}px, ${ty}px) rotate(${heading * 180 / Math.PI + 90}deg)`;
  }

  function tick() {
    if (phase === 'walk') {
      const dx = target.x - tx, dy = target.y - ty, d = Math.hypot(dx, dy);
      if (d < 2) { tx = target.x; ty = target.y; phase = 'draw'; }
      else { heading = Math.atan2(dy, dx); tx += dx / d * 2; ty += dy / d * 2; }
    } else if (phase === 'draw') {
      advance(speed);
      if (i >= pts.length) { phase = 'admire'; timer = 180; firstDone = true; }
    } else if (phase === 'admire') {
      if (--timer <= 0) { phase = 'clear'; timer = 30; }
    } else if (phase === 'clear') {
      ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 0.15; ctx.fillRect(0, 0, W, H); ctx.restore();
      if (--timer <= 0) start();
    }
    placeTurtle();
    if (!still) requestAnimationFrame(tick);
  }

  new ResizeObserver(layout).observe(intro);
  layout();
  if (still) placeTurtle(); else requestAnimationFrame(tick);
})();
</script>
</body>
</html>
