<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matheus Santana</title>
  <style>
  :root {
    --outer-bg: hsl(45 13% 8%);
    --page-bg:  hsl(40 12% 5%);
    --text:     hsl(40 45% 84%); 
  }
html {
  background: var(--outer-bg);
}
body {
  margin: 0 auto;
  max-width: 1200px;
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
  font-family: system-ui;
  background: var(--page-bg);
  color: var(--text);
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-flow: dense;
  gap: 12px;
}
.gallery img {
  width: 100%;
  height: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  display: block;
}
.gallery img.tall {
  grid-row: span 2;
  aspect-ratio: auto;
  height: 100%;
  contain: size;
}
.fill {
  position: relative;
  overflow: hidden;
}
.fill::before {
  content: "";
  position: absolute;
  inset: -20px;
  background: var(--img) center / cover;
  filter: blur(16px) brightness(0.6);
}
.fill img {
  position: relative;
  object-fit: contain;
}
.intro {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}
.intro > div,
.me {
  position: relative;
  z-index: 1;
}
.intro h1 {
  margin: 0 0 8px;
}
.intro p {
  margin: 0;
}
.wander {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}
.turtle {
  position: absolute;
  left: -10px;
  top: -17px;
  width: 20px;
  height: 34px;
  transform-origin: 10px 17px;
  z-index: 2;
  pointer-events: none;
}
.turtle polygon {
  fill: hsl(95 35% 55%);
}
.me {
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-end;
  gap: 16px;
  margin: 0;
}
.me img {
  height: 170px;
  width: auto;
  display: block;
  flex-shrink: 0;
}
.me figcaption {
  margin: 0;
  max-width: 230px;
  text-align: right;
  text-wrap: balance;
}
@media (max-width: 600px) {
  .intro { flex-direction: column; }
  .wander, .turtle { display: none; }
}
</style>
</head>
