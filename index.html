<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matheus Santana</title>
  <style>
  :root {
    --outer-bg: hsl(45 13% 8%);
    --page-bg:  hsl(40 12% 5%);
    --text:     hsl(40 45% 84%); 
  }
html {
  background: var(--outer-bg);
}
body {
  margin: 0 auto;
  max-width: 1200px;
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
  font-family: system-ui;
  background: var(--page-bg);
  color: var(--text);
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-flow: dense;
  gap: 12px;
}
.gallery img {
  width: 100%;
  height: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  display: block;
}
.gallery img.tall {
  grid-row: span 2;
  aspect-ratio: auto;
  height: 100%;
  contain: size;
}
.fill {
  position: relative;
  overflow: hidden;
}
.fill::before {
  content: "";
  position: absolute;
  inset: -20px;
  background: var(--img) center / cover;
  filter: blur(16px) brightness(0.6);
}
.fill img {
  position: relative;
  object-fit: contain;
}
.intro {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}
.intro > div,
.me {
  position: relative;
  z-index: 1;
}
.intro h1 {
  margin: 0 0 8px;
}
.intro p {
  margin: 0;
}
.wander {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}
.me {
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-end;
  gap: 16px;
  margin: 0;
}
.me img {
  height: 170px;
  width: auto;
  display: block;
  flex-shrink: 0;
}
.me figcaption {
  margin: 0;
  max-width: 230px;
  text-align: right;
  text-wrap: balance;
}
@media (max-width: 600px) {
  .intro { flex-direction: column; }
  .wander { display: none; }
}
</style>
</head>
<body>
<header class="intro">
  <canvas class="wander" aria-hidden="true"></canvas>
  <div>
    <h1>Matheus Martinelli Santana</h1>
    <p>Some of my favorite photographs I've taken</p>
  </div>
  <figure class="me">
    <img src="images/me_with_cat.jpg" alt="Cat on lap from far away">
    <figcaption>(My sister took this one. It's the cat from the photo at the bottom on my lap.)</figcaption>
  </figure>
</header>
  <div class="gallery">
    <img src="images/donkeys.jpg" alt="Donkeys">
    <img src="images/golden_pheasant.jpg" alt="Golden pheasant">
    <img src="images/agapanthus.jpg" alt="Agapanthus">
    <img src="images/bracket_fungus.jpg" alt="Bracket fungus">
    <img src="images/snowy_owl.jpg" alt="Snowy owl">
    <img src="images/house_sparrow.jpg" alt="House sparrow">
    <img src="images/queen_annes_lace.jpg" alt="Queen Anne's lace">
    <img src="images/background.JPG" alt="Truck">
    <img src="images/cat_tabby.jpg" alt="Domestic cat (tabby)">
    <img src="images/white_cat.JPG" alt="Domestic cat">
    <img src="images/muscovy_ducks.jpg" alt="Muscovy ducks">
    <img src="images/mallard.jpg" alt="Mallard">
    <img src="images/geraniums.JPG" alt="Geraniums">
    <img class="tall" src="images/peacock_pheasant.jpg" alt="Peacock pheasant" style="object-position: right center;">
    <img class="tall" src="images/common_kestrel.jpg" alt="Common kestrel">
    <img src="images/southern_ground_hornbill.jpg" alt="Southern ground hornbill">
    <img src="images/monk_parakeets.jpg" alt="Monk parakeets">
    <img src="images/marabou_stork.jpg" alt="Marabou stork">
    <img src="images/saddle_billed_stork.jpg" alt="Saddle-billed stork" style="aspect-ratio: 4 / 3;">
    <img src="images/cat_tuxedo_grass.jpg" alt="Domestic cat (black and white)">
    <img src="images/peacock.jpeg" alt="Indian peafowl">
    <img src="images/dog.jpeg" alt="Domestic dog (orange)">
  </div>
<script>
// A "turtle" that wanders in a random walk through the empty part of the header,
// leaving a faint trail that slowly fades. It steers around the title.
(() => {
  const intro = document.querySelector('.intro');
  const canvas = intro.querySelector('.wander');
  const text = intro.querySelector('div');
  const fig = intro.querySelector('.me');
  const ctx = canvas.getContext('2d');
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, x, y, angle, box, frame = 0;

  function layout() {
    const r = intro.getBoundingClientRect();
    const f = fig.getBoundingClientRect();
    const t = text.getBoundingClientRect();
    W = Math.max(0, f.left - r.left - 24);
    H = r.height;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = ink;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    box = { l: t.left - r.left - 16, t: t.top - r.top - 10,
            r: t.right - r.left + 16, b: t.bottom - r.top + 10 };
    x = (box.r + W) / 2;
    y = H / 2;
    angle = Math.random() * Math.PI * 2;
    if (still) for (let i = 0; i < 6000; i++) step();
  }

  function blocked(px, py) {
    return px < 6 || py < 6 || px > W - 6 || py > H - 6 ||
      (px > box.l && px < box.r && py > box.t && py < box.b);
  }

  function step() {
    angle += (Math.random() + Math.random() + Math.random() - 1.5) * 0.5;
    const nx = x + Math.cos(angle) * 1.4;
    const ny = y + Math.sin(angle) * 1.4;
    if (blocked(nx, ny)) { angle += Math.PI * (0.6 + Math.random() * 0.8); return; }
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    x = nx; y = ny;
  }

  function tick() {
    if (++frame % 10 === 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 0.05;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    for (let i = 0; i < 3; i++) step();
    requestAnimationFrame(tick);
  }

  new ResizeObserver(layout).observe(intro);
  layout();
  if (!still) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
